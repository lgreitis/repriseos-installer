name: Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: installer-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '8'
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY_ID: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_API_KEY_ID || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check updater signing key
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Set TAURI_SIGNING_PRIVATE_KEY in the installer-release environment."
            exit 1
          fi
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          for path in ("package.json", "src-tauri/tauri.conf.json"):
              assert json.loads(pathlib.Path(path).read_text())["version"] == version, path
          cargo = pathlib.Path("src-tauri/Cargo.toml").read_text()
          assert re.search(r'^version = "([^"]+)"', cargo, re.M)[1] == version, "Cargo.toml"
          PYTHON
      - name: Prepare macOS signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8_B64 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_API_KEY_P8_B64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set $name in the installer-release environment."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$APPLE_API_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/repriseos-notary-key.p8"
          printf 'APPLE_API_KEY_PATH=%s\n' "$RUNNER_TEMP/repriseos-notary-key.p8" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.22.0'
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_ID }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: RepriseOS Installer ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadPlainBinary: ${{ runner.os == 'Windows' }}
          uploadWorkflowArtifacts: true
      - name: Remove notarization key
        if: always() && runner.os == 'macOS'
        run: rm -f "$RUNNER_TEMP/repriseos-notary-key.p8"

  verify-updater:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Verify complete update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          python3 - <<'PYTHON'
          import json, os
          feed = json.load(open("latest.json"))
          tag = os.environ["RELEASE_TAG"]
          assert feed["version"].removeprefix("v") == tag.removeprefix("v")
          prefix = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/"
          for target in ("darwin-aarch64", "darwin-x86_64", "windows-x86_64"):
              platform = feed["platforms"].get(target + "-nsis") if target.startswith("windows") else None
              platform = platform or feed["platforms"][target]
              assert platform["url"].startswith(prefix), target
              assert platform["signature"], target
          PYTHON
