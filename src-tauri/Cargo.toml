[package]
name = "repriseos-installer"
version = "0.2.2"
license = "GPL-3.0-only"
description = "RepriseOS installer for iPod Classic"
edition = "2021"

[lib]
# A distinct library name avoids Windows linker collisions.
name = "repriseos_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reprise-bundle = { git = "https://github.com/lgreitis/osos-lab.git", rev = "43f983338fa65388738802072248868c947537b7" }
reprise-device = { git = "https://github.com/lgreitis/osos-lab.git", rev = "43f983338fa65388738802072248868c947537b7" }
# Build reprise-device's libusb dependency for each target architecture.
rusb = { version = "0.9.4", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "~2.10.1"
semver = "1"
tauri-plugin-opener = "~2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
