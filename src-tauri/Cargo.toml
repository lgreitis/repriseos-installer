[package]
name = "repriseos-installer"
version = "0.1.0"
description = "RepriseOS installer for iPod Classic"
edition = "2021"

[lib]
# A distinct library name avoids Windows linker collisions.
name = "repriseos_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reprise-bundle = { path = "../../osos-lab/host/crates/reprise-bundle" }
reprise-device = { path = "../../osos-lab/host/crates/reprise-device" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
